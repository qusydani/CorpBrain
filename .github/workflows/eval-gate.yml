# Eval gate: blocks a PR when answer accuracy drops below the committed baseline
# (tests/fixtures/eval_baseline.json). Runs the agent and the best plain-RAG
# config on the public fixture corpus. Needs the GOOGLE_API_KEY repo secret.
# To make it block merges, mark the "eval-gate" check as required in branch
# protection (see README, "CI eval gate").
name: eval-gate

on:
  pull_request:
    paths:
      - "**.py"
      - "requirements.txt"
      - "tests/fixtures/**"
      - ".github/workflows/eval-gate.yml"
  workflow_dispatch:

concurrency:
  group: eval-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CORPBRAIN_CORPUS: fixture
      PYTHONUTF8: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        # CPU-only torch first, so sentence-transformers doesn't pull the CUDA build.
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache reranker model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cross-encoder-ms-marco-MiniLM-L-6-v2

      - name: Unit tests (no API calls)
        run: python -m pytest -q

      - name: Check API key secret
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "::error::GOOGLE_API_KEY secret is not set (or this PR is from a fork, which gets no secrets)."
            exit 1
          fi

      - name: Build fixture index from the committed cache
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python ingest.py

      - name: Eval gate
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python eval.py gate

      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-results
          path: eval_data/gate_results.json
          if-no-files-found: ignore
